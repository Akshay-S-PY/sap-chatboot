# .github/workflows/build_dataset.yml
name: Build SAP Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"   # Weekly on Sunday at 6 AM UTC

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Install dependencies
        run: |
          pip install requests beautifulsoup4 huggingface-hub lxml
          
      - name: 🗃️ Build dataset
        run: |
          python tools/build_dataset.py
          echo "Dataset file(s):"
          ls -la data/sap_dataset.json || true
          
      - name: 📊 Check dataset quality
        run: |
          if [ -f "data/sap_dataset.json" ]; then
            echo "Dataset info:"
            python << 'EOF'
import json
from pathlib import Path

p = Path('data/sap_dataset.json')
print(f'File: {p} | size: {p.stat().st_size:,} bytes')
with p.open('r', encoding='utf-8') as f:
    data = json.load(f)
print(f'Articles: {len(data)}')
total_chars = sum(len(article.get('content', '')) for article in data)
print(f'Total characters: {total_chars:,}')
avg_length = total_chars / len(data) if data else 0
print(f'Average article length: {avg_length:,.0f} characters')
EOF
          else
            echo "❌ No dataset file created"
            exit 1
          fi
          
      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          python tools/upload_to_hf.py
          
      - name: ✅ Completion message
        run: |
          echo "🎉 Dataset build and upload completed!"
          echo "📊 Check your dataset at: https://huggingface.co/datasets/${{ secrets.HF_DATASET_REPO }}"
