name: Crawl & Build (SAP Basis)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC (optional)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests beautifulsoup4 playwright trafilatura tqdm \
            sentence-transformers faiss-cpu numpy huggingface_hub

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Discover Basis article URLs
        run: python tools/00_discover_basis.py

      - name: Fetch (rendered)
        run: python tools/01_fetch_rendered.py

      - name: Build index
        run: |
          python tools/02_clean_chunk.py
          python tools/03_embed_build.py

      # Decide whether to store artifacts in repo (<=90MB) or Hugging Face (>90MB)
      - name: Decide storage (repo vs. Hugging Face)
        id: decide
        shell: bash
        run: |
          if [ -f index/index.faiss ]; then
            BYTES=$(stat -c%s "index/index.faiss")
          else
            BYTES=0
          fi
          echo "size=$BYTES" >> "$GITHUB_OUTPUT"
          if [ "$BYTES" -le 90000000 ]; then
            echo "store=repo" >> "$GITHUB_OUTPUT"
          else
            echo "store=hf" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit artifacts to repo (if small)
        if: steps.decide.outputs.store == 'repo'
        run: |
          git config user.name "rag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seeds.txt -A || true
          git add data/raw/*.md -A || true
          git add index/index.faiss index/meta.json index/dim.json || true
          git commit -m "basis: crawl + index rebuild" || echo "no changes"
          git push || true

      - name: Upload artifacts to Hugging Face (if large)
        if: steps.decide.outputs.store == 'hf'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}   # e.g. your_username/sap-basis-rag
        shell: bash
        run: |
          python - <<'PY'
from huggingface_hub import HfApi
import os, sys, pathlib
repo = os.environ.get("HF_REPO")
token = os.environ.get("HF_TOKEN")
if not repo or not token:
    print("HF_REPO or HF_TOKEN not set; cannot upload.", file=sys.stderr)
    sys.exit(1)
api = HfApi(token=token)
api.create_repo(repo_id=repo, repo_type="dataset", exist_ok=True)
files = [
    ("index/index.faiss", "index.faiss"),
    ("index/meta.json",  "meta.json"),
    ("index/dim.json",   "dim.json"),
]
for src, dst in files:
    if pathlib.Path(src).exists():
        api.upload_file(path_or_fileobj=src, path_in_repo=dst,
                        repo_id=repo, repo_type="dataset")
print("Uploaded artifacts to", repo)
PY
