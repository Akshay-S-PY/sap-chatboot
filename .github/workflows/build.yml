# .github/workflows/build.yml
name: SAP Basis Knowledge Base Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # Daily 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install faiss-cpu
          pip install streamlit sentence-transformers huggingface-hub
          pip install requests beautifulsoup4 requests-html trafilatura tqdm

      - name: Discover SAP Basis URLs
        run: python tools/00_discover_basis.py

      - name: Fetch and extract content
        run: python tools/01_fetch_rendered_alt.py

      - name: Build knowledge index
        run: |
          python tools/02_clean_chunk.py
          python tools/03_embed_build.py

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python tools/upload_to_hf.py

      - name: Notify completion
        run: echo "Knowledge base updated successfully!"
