# .github/workflows/build.yml
name: SAP Basis Knowledge Base Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # Daily 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-22.04  # Use Ubuntu 22.04 instead of latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxcb1 \
            libxkbcommon0 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2 \
            libatspi2.0-0 \
            libwayland-client0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy<2
          pip install faiss-cpu
          pip install streamlit sentence-transformers huggingface-hub
          pip install requests beautifulsoup4 playwright trafilatura tqdm

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Discover SAP Basis URLs
        run: python tools/00_discover_basis.py

      - name: Fetch and extract content
        run: python tools/01_fetch_rendered.py

      - name: Build knowledge index
        run: |
          python tools/02_clean_chunk.py
          python tools/03_embed_build.py

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          python tools/upload_to_hf.py

      - name: Notify completion
        run: |
          echo "Knowledge base updated successfully!"
          echo "Repository: ${{ secrets.HF_DATASET_REPO }}"
