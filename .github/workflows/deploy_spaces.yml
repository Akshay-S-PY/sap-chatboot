name: Deploy to HuggingFace Spaces

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'config.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/deploy_spaces.yml'

jobs:
  deploy:
    name: Deploy app to HuggingFace Spaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to HF Space
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        run: |
          # Configure git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com"
          
          SPACE_GIT="https://oauth2:${HF_WRITE_TOKEN}@huggingface.co/spaces/Psytamaa/sap-chatbot"
          
          # Clone existing space or create new
          if git clone --depth 1 "$SPACE_GIT" hf_space 2>/dev/null; then
            echo "✅ Cloned existing Space"
          else
            echo "📁 Initializing new Space"
            mkdir -p hf_space
            cd hf_space
            git init
            git remote add origin "$SPACE_GIT"
            cd ..
          fi
          
          # Configure git in cloned repo
          cd hf_space
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B main 2>/dev/null || true
          cd ..
          
          # Sync files (rsync exit code 24 = some files vanished, which is OK)
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.github' \
            --exclude 'hf_space' \
            --exclude 'space' \
            . hf_space/ || RSYNC_EXIT=$?
          
          if [ "${RSYNC_EXIT:-0}" -ne 0 ] && [ "${RSYNC_EXIT:-0}" -ne 24 ]; then
            echo "❌ rsync failed with exit code $RSYNC_EXIT"
            exit 1
          fi
          
          # Commit and push
          cd hf_space
          git add -A
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to deploy"
          else
            git commit -m "Deploy from GitHub Actions $(date -u +%Y-%m-%d_%H:%M:%S)"
            git push origin main --force
            echo "✅ Successfully deployed!"
          fi

      - name: ✅ Deploy complete
        run: |
          echo "🎉 App deployed to https://huggingface.co/spaces/Psytamaa/sap-chatbot"