name: Deploy to HuggingFace Spaces

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'config.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/deploy_spaces.yml'

jobs:
  deploy:
    name: Deploy app to HuggingFace Spaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to HF Space
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        run: |
          set -e
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          SPACE_GIT="https://$HF_WRITE_TOKEN@huggingface.co/spaces/Psytamaa/sap-chatbot"
          
          # Clone or init space repo
          git clone --depth 1 "$SPACE_GIT" space || (mkdir space && cd space && git init && git remote add origin "$SPACE_GIT")
          
          # Sync files from GitHub to Space (ignore vanishing file warnings)
          cd space
          git checkout -B main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          cd ..
          rsync -av --delete --exclude .git --exclude .gitignore --exclude .github . space/ || [ $? -eq 24 ] && echo "rsync completed with vanishing file warnings (ok)"
          
          cd space
          git add -A
          
          # Export git identity env vars for commit
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com"
          
          git commit -m "Deploy Streamlit app from GitHub" || echo "No changes to commit"
          git push origin HEAD:main --force

      - name: ✅ Deploy complete
        run: |
          echo "🎉 App deployed to https://huggingface.co/spaces/Psytamaa/sap-chatbot"
