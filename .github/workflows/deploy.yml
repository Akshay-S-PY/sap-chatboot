name: Ingest + Deploy to HF Space

on:
  workflow_dispatch:

jobs:
  ingest:
    name: Build dataset and ingest to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dataset
        run: |
          python tools/build_dataset.py
          ls -la data/sap_dataset.json

      - name: Run ingestion script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          JSON_DATASET_PATH: data/sap_dataset.json
        run: |
          python ingest.py

  deploy_space:
    name: Deploy app to Hugging Face Space
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare HF Space repo
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          HF_SPACE: Psytamaa/sap-chatbot
        run: |
          set -e
          SPACE_GIT="https://$HF_USERNAME:$HF_WRITE_TOKEN@huggingface.co/spaces/$HF_SPACE.git"
          git clone --depth 1 "$SPACE_GIT" space || (mkdir space && git init space && cd space && git remote add origin "$SPACE_GIT" && cd ..)
          cd space
          git checkout -B main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cd ..
          rsync -av --delete --exclude .git . space/
          cd space
          git add -A
          git commit -m "Deploy Streamlit app (CI) [ci skip]" || echo "No changes to commit"
          git push origin HEAD:main --force
