name: Ingest + Deploy to HF Space

on:
  workflow_dispatch:

jobs:
  ingest:
    name: Build dataset and ingest to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dataset
        run: |
          python tools/build_dataset.py
          ls -la data/sap_dataset.json

      - name: Run ingestion script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          JSON_DATASET_PATH: data/sap_dataset.json
        run: |
          python ingest.py

  deploy_space:
    name: Deploy app to Hugging Face Space
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        run: |
          set -e
          
          # Configure git globally first
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Set git environment variables
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com"
          
          # Clone or initialize the HF Space repo
          SPACE_URL="https://oauth2:${HF_TOKEN}@huggingface.co/spaces/Psytamaa/sap-chatbot"
          
          if git clone --depth 1 "$SPACE_URL" hf_space 2>/dev/null; then
            echo "✅ Cloned existing Space"
          else
            echo "📁 Creating new Space directory"
            mkdir -p hf_space
            cd hf_space
            git init
            git remote add origin "$SPACE_URL"
            cd ..
          fi
          
          # Configure git inside the cloned repo
          cd hf_space
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # Ensure we're on main branch
          git checkout -B main 2>/dev/null || git checkout main 2>/dev/null || true
          cd ..
          
          # Sync files (exclude .git, space folder, and workflow files)
          rsync -av --delete \
            --exclude '.git' \
            --exclude 'hf_space' \
            --exclude '.github' \
            . hf_space/
          
          # Commit and push
          cd hf_space
          git add -A
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to deploy"
          else
            git commit -m "Deploy from GitHub Actions $(date -u +%Y-%m-%d_%H:%M:%S)"
            git push origin main --force
            echo "✅ Successfully deployed to Hugging Face Space!"
          fi